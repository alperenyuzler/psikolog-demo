<svg class="yz-logo" xmlns="http://www.w3.org/2000/svg" viewBox="40 30 1110 770" role="img" aria-label="YÜZLER"><style>.yz-logo{display:block;overflow:visible;--yz:#3acf75}
.yz-logo path,.yz-logo circle{fill:var(--yz)}.yz-logo .yz-o,.yz-logo .yz-face path{fill:none;stroke:var(--yz)}
.yz-logo .yz-wv,.yz-logo .yz-sw,.yz-logo .yz-eye,.yz-logo .yz-smile{transform-box:fill-box;transform-origin:center}
.yz-logo .yz-top{animation:yzIn .9s .1s both cubic-bezier(.2,.7,.2,1)}
.yz-logo .yz-num{animation:yzPop .9s both cubic-bezier(.2,.7,.2,1);transform-origin:50% 55%;transform-box:fill-box}
.yz-logo .yz-waves{animation:yzIn .9s .3s both cubic-bezier(.2,.7,.2,1)}
.yz-logo .yz-sw.a{transform-origin:20% 90%;animation:yzSway 4.6s ease-in-out infinite}
.yz-logo .yz-sw.b{animation:yzSway 5.2s -1.2s ease-in-out infinite}
.yz-logo .yz-sw.c{animation:yzSway 3.8s -2s ease-in-out infinite}
.yz-logo .w1{animation:yzWave 3.6s ease-in-out infinite}
.yz-logo .w2{animation:yzWave 3.6s -1.8s ease-in-out infinite}
.yz-logo .yz-eye{animation:yzBlink 4.5s infinite}
.yz-logo .yz-smile{animation:yzSmile 4.5s ease-in-out infinite}
.yz-logo .yz-num{animation:yzPop .9s both cubic-bezier(.2,.7,.2,1),yzBreath 5s 1s ease-in-out infinite}
@keyframes yzIn{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes yzPop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes yzBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes yzSway{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(10px,-9px) rotate(-3deg)}}
@keyframes yzWave{0%,100%{transform:translate(-14px,3px) scaleY(1)}50%{transform:translate(14px,-5px) scaleY(1.25)}}
@keyframes yzBlink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.15)}}
@keyframes yzSmile{0%,100%{transform:scale(1)}50%{transform:scale(1.07,1.12)}}
.yz-logo{--yz-x:#9af7c2}.yz-logo .yz-x{filter:drop-shadow(0 0 5px rgba(154,247,194,.55))}
